name: Update fixtures

on:
  schedule:
    # Every 3 hours (times are UTC). GitHub sometimes runs these a little late.
    - cron: "17 */3 * * *"
  workflow_dispatch: {} # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-fixtures
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch fixtures and TV channels
        run: node scripts/build.mjs data.json

      - name: Save data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update fixtures" || echo "No changes"
          git push
